version: '3'

vars:
  GO_VERSION: '1.26.0'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.10.0'
  BUF_VERSION: '1.69.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.1'
  OGEN_VERSION: 'v1.20.3'
  MOCKERY_VERSION: 'v3.7.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  BUF: '{{.BIN_DIR}}/buf'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'
  OGEN: '{{.BIN_DIR}}/ogen'
  MOCKERY: '{{.BIN_DIR}}/mockery'

  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: '{{.COVERAGE_DIR}}/coverage.out'
  COVERAGE_THRESHOLD: '40'

  MODULES: order inventory payment

tasks:
  formatters:install:
    desc: "Installs gofumpt and gci"
    cmds:
      - echo '📦 Installing gofumpt...'
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - echo '📦 Installing gci...'
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  golangci-lint:install:
    desc: "Installs golangci-lint"
    cmds:
      - echo '📦 Installing golangci-lint...'
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  buf:install:
    desc: "Installs buf"
    cmds:
      - echo '📦 Installing buf...'
      - GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
    status:
      - test -x {{.BUF}}

  proto:install-plugins:
    desc: "Installs protoc plugins"
    cmds:
      - echo '📦 Installing protoc-gen-go...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - echo '📦 Installing protoc-gen-go-grpc...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
    status:
      - test -x {{.PROTOC_GEN_GO}}
      - test -x {{.PROTOC_GEN_GO_GRPC}}

  ogen:install:
    desc: "Installs ogen"
    cmds:
      - echo '📦 Installing ogen...'
      - GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
    status:
      - test -x {{.OGEN}}

  mockery:install:
    desc: "Installs mockery"
    cmds:
      - echo '📦 Installing mockery...'
      - GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v3@{{.MOCKERY_VERSION}}
    status:
      - test -x {{.MOCKERY}}

  mocks:gen:
    desc: "Generates interface mocks"
    deps: [mockery:install]
    cmds:
      - echo '🧪 Generating mocks...'
      - '{{.MOCKERY}}'

  setup:
    desc: "Installs all tools"
    deps: [formatters:install, golangci-lint:install, buf:install, proto:install-plugins, ogen:install, mockery:install]

  format:
    desc: "Formats the code (gofumpt + gci)"
    deps: [formatters:install]
    cmds:
      - echo '🧹 Formatting code with gofumpt...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GOFUMPT}} -extra -w {} +
      - echo '📦 Sorting imports with gci...'
      # TODO: Change the prefix to your own module
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/omaigo88)" {} +

  build:
    desc: "Builds all Go modules (go build)"
    cmds:
      - go build ./order/... ./inventory/... ./payment/...

  lint:
    desc: "Runs golangci-lint"
    deps: [golangci-lint:install]
    cmds:
      - '{{.GOLANGCI_LINT}} run --allow-parallel-runners order/... inventory/... payment/... --config=.golangci.yml'

  proto:format:
    desc: "Formats .proto files (buf format)"
    deps: [buf:install]
    dir: shared/proto
    cmds:
      - echo '🧹 Formatting .proto files...'
      - '{{.BUF}} format -w'

  proto:lint:
    desc: "Lints .proto files"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔍 Linting .proto files...'
      - '{{.BUF}} lint'

  proto:gen:
    desc: "Generates Go code from .proto"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔨 Generating Go code from .proto...'
      - '{{.BUF}} generate'

  ogen:gen:
    desc: "Generates Go code from OpenAPI"
    deps: [ogen:install]
    dir: shared
    cmds:
      - echo '🔨 Generating Go code from OpenAPI...'
      - '{{.OGEN}} -target ./pkg/openapi/order/v1 -package orderv1 -clean ./api/order/v1/order.openapi.yaml 2>/dev/null'

  gen:
    desc: "Generates all code"
    cmds:
      - task: proto:gen
      - task: ogen:gen

  deps:update:
    desc: "Updates dependencies"
    cmds:
      - echo '🔄 Syncing go.work...'
      - go work sync
      - echo '🔄 Updating dependencies in services...'
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy -compat={{.GO_VERSION}}
      - echo '🔄 Updating dependencies in shared (proto/openapi)...'
      - cd shared && go mod tidy -compat={{.GO_VERSION}}

  run:inventory:
    desc: "Runs InventoryService (gRPC :50051)"
    dir: inventory
    cmds:
      - go run ./cmd

  run:payment:
    desc: "Runs PaymentService (gRPC :50052)"
    dir: payment
    cmds:
      - go run ./cmd

  run:order:
    desc: "Runs OrderService (HTTP :8080)"
    dir: order
    cmds:
      - go run ./cmd

  test:
    desc: "Runs unit tests with the race detector (excluding API tests from order/tests)"
    cmds:
      - |
        for mod in order inventory payment; do
          echo "=== $mod ==="
          (cd "$mod" && MOD=$(GOWORK=off go list -m) && go test -v -race -count=1 $(go list ./... | grep -vE "^${MOD}/tests(/|$)"))
        done

  test:api:
    desc: "Runs the API tests"
    cmds:
      - go test -v ./order/tests/...

  test:e2e:
    desc: "Builds and runs all 3 services as real processes and smoke-tests them with curl"
    cmds:
      - ./scripts/e2e_test.sh

  coverage:clean:
    desc: "Cleans the coverage report directory"
    internal: true
    cmds:
      - rm -rf {{.COVERAGE_DIR}}
      - mkdir -p {{.COVERAGE_DIR}}

  test:coverage:
    desc: "Runs tests with business-logic coverage (excluding API tests from order/tests)"
    deps: [coverage:clean]
    vars:
      TARGET_PACKAGES:
        sh: |
          for mod in order inventory payment; do
            (cd "$mod" && go list ./... | grep -v "/mocks" | grep -E '/(api|service)($|/)')
          done | tr '\n' ','
    preconditions:
      - sh: test -n "{{.TARGET_PACKAGES}}"
        msg: "No packages found to test"
    cmds:
      - echo "📦 Target packages:{{.TARGET_PACKAGES}}"
      - |
        for mod in order inventory payment; do
          echo "=== $mod ==="
          (cd "$mod" && MOD=$(GOWORK=off go list -m) && go test -v -race -covermode=atomic -coverprofile={{.COVERAGE_DIR}}/${mod}.out -coverpkg={{.TARGET_PACKAGES}} $(go list ./... | grep -vE "^${MOD}/tests(/|$)"))
        done
      - echo "📊 Merging coverage reports..."
      - |
        head -1 {{.COVERAGE_DIR}}/order.out > {{.COVERAGE_FILE}}
        for f in {{.COVERAGE_DIR}}/order.out {{.COVERAGE_DIR}}/inventory.out {{.COVERAGE_DIR}}/payment.out; do
          tail -n +2 "$f" >> {{.COVERAGE_FILE}}
        done
      - echo "📊 Coverage by function:"
      - go tool cover -func={{.COVERAGE_FILE}}
      - task: coverage:threshold

  coverage:threshold:
    desc: "Checks that coverage meets the threshold"
    internal: true
    vars:
      COVERAGE:
        sh: go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | awk '{print $NF}' | tr -d '%'
    preconditions:
      - sh: test -f {{.COVERAGE_FILE}}
        msg: "Coverage file not found. Run task test:coverage"
    cmds:
      - echo "🧾 Total coverage:{{.COVERAGE}}% | Threshold:{{.COVERAGE_THRESHOLD}}%"
      - cmd: test $(echo "{{.COVERAGE}} >= {{.COVERAGE_THRESHOLD}}" | bc) -eq 1
      - echo "✅ Coverage meets the threshold"

  coverage:html:
    desc: "Generates an HTML coverage report"
    deps: [test:coverage]
    vars:
      HTML_FILE: '{{.COVERAGE_DIR}}/coverage.html'
    cmds:
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.HTML_FILE}}
      - echo "🌐 Report saved to {{.HTML_FILE}}"
      - cmd: open {{.HTML_FILE}}
        platforms: [darwin]
      - cmd: xdg-open {{.HTML_FILE}}
        platforms: [linux]
      - cmd: start {{.HTML_FILE}}
        platforms: [windows]

  coverage:check:
    desc: "Checks coverage without running tests"
    cmds:
      - task: coverage:threshold
