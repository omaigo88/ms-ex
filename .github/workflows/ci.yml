# Quality gate for pull requests into main. Everything runs through the same
# Taskfile tasks used locally, with tool versions pinned in Taskfile.yaml.
# E2E (Docker + Kafka) is intentionally not part of CI — run `task test:e2e`
# locally before opening the PR.
#
# The ruleset on main requires the single "CI passed" check, so jobs can be
# added or renamed here without touching the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: 3.x

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yaml') }}

      - name: Build
        run: task build
      - name: golangci-lint
        run: task lint
      - name: Proto lint
        run: task proto:lint
      - name: Formatting is applied
        run: |
          task format
          git diff --exit-code || { echo "::error::Run 'task format' and commit the result"; exit 1; }

  generated:
    name: Generated code & go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yaml') }}

      - name: Generated code is up to date
        run: |
          task gen
          task mocks:gen
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff; echo "::error::Run 'task gen && task mocks:gen' and commit the result"; exit 1; }
      - name: go.mod files are tidy
        run: |
          for m in shared inventory payment order assembly; do
            (cd "$m" && GOWORK=off go mod tidy -diff) || { echo "::error::Run 'go mod tidy' in $m"; exit 1; }
          done

  unit-tests:
    name: Unit tests (race) + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # test:coverage runs the same packages as `task test` with -race, plus
      # the coverage threshold check (which needs bc).
      - name: Install bc
        run: command -v bc || (sudo apt-get update && sudo apt-get install -y bc)
      - name: Unit tests with coverage threshold
        run: task test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/coverage.out
          if-no-files-found: ignore

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: API tests
        run: task test:api

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, generated, unit-tests, api-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
