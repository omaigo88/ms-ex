version: "2"

linters:
  default: standard
  exclusions:
    paths:
      - '.*/mocks/.*'
      - '.*/pkg/proto/.*'
      - '.*/pkg/openapi/.*'

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/omaigo88)
  exclusions:
    paths:
      - '.*/mocks/.*'
      - '.*/pkg/proto/.*'
      - '.*/pkg/openapi/.*'
