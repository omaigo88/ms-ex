# Single compose file for the whole infrastructure: Order, Inventory,
# Payment, Assembly, Order/Inventory's own Postgres instances, and Kafka
# (+ Kafka UI on localhost:8090). All services share
# the project's default network and reach each other by service name
# (e.g. Order calls Inventory at "inventory:50051") — no external network or
# host.docker.internal hack needed since everything lives in one project.
name: ms-ex

services:
  order:
    build:
      context: ../..
      dockerfile: order/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # In-network DSN: "localhost" inside this container is the container
      # itself, not the order-postgres container, so this is built from the
      # ORDER_POSTGRES_* vars rather than reusing order.env's host-side DB_URI.
      DB_URI: postgres://${ORDER_POSTGRES_USER}:${ORDER_POSTGRES_PASSWORD}@order-postgres:5432/${ORDER_POSTGRES_DB}?sslmode=disable
      INVENTORY_SERVICE_ADDRESS: ${INVENTORY_SERVICE_ADDRESS}
      PAYMENT_SERVICE_ADDRESS: ${PAYMENT_SERVICE_ADDRESS}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      order-postgres:
        condition: service_healthy
      inventory:
        condition: service_started
      payment:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
    ports:
      - "${ORDER_POSTGRES_PORT}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER} -d ${ORDER_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  inventory:
    build:
      context: ../..
      dockerfile: inventory/Dockerfile
    ports:
      - "50051:50051"
    environment:
      # In-network DSN, see the note on order's DB_URI above.
      DB_URI: postgres://${INVENTORY_POSTGRES_USER}:${INVENTORY_POSTGRES_PASSWORD}@inventory-postgres:5432/${INVENTORY_POSTGRES_DB}?sslmode=disable
    depends_on:
      inventory-postgres:
        condition: service_healthy

  inventory-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
    ports:
      - "${INVENTORY_POSTGRES_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER} -d ${INVENTORY_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  payment:
    build:
      context: ../..
      dockerfile: payment/Dockerfile
    ports:
      - "50052:50052"

  assembly:
    build:
      context: ../..
      dockerfile: assembly/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      ASSEMBLY_BUILD_DELAY_MIN: ${ASSEMBLY_BUILD_DELAY_MIN:-5s}
      ASSEMBLY_BUILD_DELAY_MAX: ${ASSEMBLY_BUILD_DELAY_MAX:-15s}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Single-node KRaft broker. PLAINTEXT is the in-network listener the
  # services use (kafka:9092); EXTERNAL is for host-run tools and
  # `task run:*` (localhost:9094).
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates topics up front so consumers never race topic auto-creation.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in order.paid ship.assembled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ms-ex
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  order-postgres-data:
  inventory-postgres-data:
