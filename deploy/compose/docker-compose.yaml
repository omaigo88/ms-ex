# Single compose file for the whole infrastructure: Order, Inventory,
# Payment, Assembly, IAM, the Postgres instances of Order/Inventory/IAM,
# Redis (IAM sessions), and Kafka (+ Kafka UI on localhost:8090).
#
# The "observability" profile adds the telemetry backends (`task up-all`):
# OTel Collector :4317 → Elasticsearch + Kibana :5601 (logs),
# Prometheus :9090 + Grafana :3000 (metrics), Jaeger :16686 (traces).
# Every service exports OTLP to the collector unless OTEL_SDK_DISABLED=true
# (`task up` sets it, since the plain stack has no collector). All services share
# the project's default network and reach each other by service name
# (e.g. Order calls Inventory at "inventory:50051") — no external network or
# host.docker.internal hack needed since everything lives in one project.
name: ms-ex

services:
  order:
    build:
      context: ../..
      dockerfile: order/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # In-network DSN: "localhost" inside this container is the container
      # itself, not the order-postgres container, so this is built from the
      # ORDER_POSTGRES_* vars rather than reusing order.env's host-side DB_URI.
      DB_URI: postgres://${ORDER_POSTGRES_USER}:${ORDER_POSTGRES_PASSWORD}@order-postgres:5432/${ORDER_POSTGRES_DB}?sslmode=disable
      INVENTORY_SERVICE_ADDRESS: ${INVENTORY_SERVICE_ADDRESS}
      PAYMENT_SERVICE_ADDRESS: ${PAYMENT_SERVICE_ADDRESS}
      IAM_SERVICE_ADDRESS: iam:50053
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      otel-collector:
        # Only present with `task up-all`; ignored by plain `task up`.
        condition: service_started
        required: false
      order-postgres:
        condition: service_healthy
      iam:
        condition: service_started
      inventory:
        condition: service_started
      payment:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
    ports:
      - "${ORDER_POSTGRES_PORT}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER} -d ${ORDER_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  inventory:
    build:
      context: ../..
      dockerfile: inventory/Dockerfile
    ports:
      - "50051:50051"
    environment:
      # In-network DSN, see the note on order's DB_URI above.
      DB_URI: postgres://${INVENTORY_POSTGRES_USER}:${INVENTORY_POSTGRES_PASSWORD}@inventory-postgres:5432/${INVENTORY_POSTGRES_DB}?sslmode=disable
      IAM_SERVICE_ADDRESS: iam:50053
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      otel-collector:
        # Only present with `task up-all`; ignored by plain `task up`.
        condition: service_started
        required: false
      inventory-postgres:
        condition: service_healthy
      iam:
        condition: service_started

  inventory-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
    ports:
      - "${INVENTORY_POSTGRES_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER} -d ${INVENTORY_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  iam:
    build:
      context: ../..
      dockerfile: iam/Dockerfile
    ports:
      - "50053:50053"
    environment:
      # In-network DSN, see the note on order's DB_URI above.
      DB_URI: postgres://${IAM_POSTGRES_USER}:${IAM_POSTGRES_PASSWORD}@iam-postgres:5432/${IAM_POSTGRES_DB}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      IAM_SESSION_TTL: ${IAM_SESSION_TTL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      otel-collector:
        # Only present with `task up-all`; ignored by plain `task up`.
        condition: service_started
        required: false
      iam-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  iam-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IAM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${IAM_POSTGRES_DB}
    ports:
      - "${IAM_POSTGRES_PORT}:5432"
    volumes:
      - iam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAM_POSTGRES_USER} -d ${IAM_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Session store for IAM only (no caching). Sessions are hashes with a TTL,
  # so nothing needs to survive a restart beyond what the TTL allows.
  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  payment:
    build:
      context: ../..
      dockerfile: payment/Dockerfile
    ports:
      - "50052:50052"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      otel-collector:
        # Only present with `task up-all`; ignored by plain `task up`.
        condition: service_started
        required: false

  assembly:
    build:
      context: ../..
      dockerfile: assembly/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      ASSEMBLY_BUILD_DELAY_MIN: ${ASSEMBLY_BUILD_DELAY_MIN:-5s}
      ASSEMBLY_BUILD_DELAY_MAX: ${ASSEMBLY_BUILD_DELAY_MAX:-15s}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      otel-collector:
        # Only present with `task up-all`; ignored by plain `task up`.
        condition: service_started
        required: false
      kafka-init:
        condition: service_completed_successfully

  # Single-node KRaft broker. PLAINTEXT is the in-network listener the
  # services use (kafka:9092); EXTERNAL is for host-run tools and
  # `task run:*` (localhost:9094).
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates topics up front so consumers never race topic auto-creation.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in order.paid ship.assembled; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ms-ex
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability (profile "observability", started by `task up-all`)
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Published for host-run services (`task run:*`).
      - "4317:4317"
      - "4318:4318"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  # The collector's elasticsearch exporter writes to a data stream, which
  # needs a matching index template: otel-logs* gets the same composition as
  # ES's built-in logs-otel@template (OTel-native field mappings).
  elasticsearch-init:
    image: curlimages/curl:8.16.0
    profiles: [observability]
    command:
      - -fsS
      - -X
      - PUT
      - http://elasticsearch:9200/_index_template/otel-logs
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/otel-logs-index-template.json"
    volumes:
      - ./observability/elasticsearch/otel-logs-index-template.json:/otel-logs-index-template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    profiles: [observability]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Creates the otel-logs data view once Kibana is up.
  kibana-init:
    image: curlimages/curl:8.16.0
    profiles: [observability]
    entrypoint: ["/bin/sh", "/kibana-init.sh"]
    volumes:
      - ./observability/kibana-init.sh:/kibana-init.sh:ro
    depends_on:
      kibana:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.7.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  # Jaeger v2 all-in-one (in-memory storage). Receives OTLP from the collector
  # on jaeger:4317 (not published, the collector owns host port 4317).
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: [observability]
    ports:
      - "16686:16686"

volumes:
  kafka-data:
  order-postgres-data:
  inventory-postgres-data:
  iam-postgres-data:
  elasticsearch-data:
