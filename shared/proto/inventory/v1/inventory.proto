syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/omaigo88/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService manages the catalog of spaceship parts
service InventoryService {
  // GetPart returns a part by UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // ListParts returns a list of parts
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);

  // ReserveParts reserves exactly one unit of every listed part, atomically
  // as a set (including a cross-part compatibility check).
  rpc ReserveParts(ReservePartsRequest) returns (ReservePartsResponse);

  // ReleaseParts releases a previous reservation of one unit of every
  // listed part.
  rpc ReleaseParts(ReleasePartsRequest) returns (ReleasePartsResponse);

  // CommitParts finalizes a reservation: one unit of every listed part leaves
  // the warehouse (both reserved and stock quantity are decremented).
  rpc CommitParts(CommitPartsRequest) returns (CommitPartsResponse);
}

// Part type
enum PartType {
  // Type not set
  PART_TYPE_UNSPECIFIED = 0;
  // Ship hull
  PART_TYPE_HULL = 1;
  // Engine
  PART_TYPE_ENGINE = 2;
  // Shield
  PART_TYPE_SHIELD = 3;
  // Weapon
  PART_TYPE_WEAPON = 4;
}

// Part represents a spaceship part
message Part {
  // Unique part identifier
  string uuid = 1;

  // Part name
  string name = 2;

  // Part description
  string description = 3;

  // Price in kopecks (5000₽ = 500000)
  int64 price = 4;

  // Part type
  PartType part_type = 5;

  // Units in the warehouse (including reserved ones)
  int64 stock_quantity = 6;

  // When the part was added to the catalog
  google.protobuf.Timestamp created_at = 7;
}

// Request to get a part by UUID
message GetPartRequest {
  // Part UUID
  string uuid = 1;
}

// Response for a get part request
message GetPartResponse {
  // The requested part
  Part part = 1;
}

// Request for a list of parts
message ListPartsRequest {
  // Filter by part type (unset = any type)
  PartType part_type = 1;
  // Filter by part UUIDs (empty = all parts)
  repeated string uuids = 2;
}

// Response for a list parts request
message ListPartsResponse {
  // Matching parts
  repeated Part parts = 1;
}

// Request to reserve one unit of each listed part
message ReservePartsRequest {
  // UUIDs of the parts to reserve
  repeated string uuids = 1;
}

// Response for a reserve parts request
message ReservePartsResponse {}

// Request to release one unit of each listed part
message ReleasePartsRequest {
  // UUIDs of the parts to release
  repeated string uuids = 1;
}

// Response for a release parts request
message ReleasePartsResponse {}

// Request to commit (write off) one reserved unit of each listed part
message CommitPartsRequest {
  // UUIDs of the reserved parts to commit
  repeated string uuids = 1;
}

// Response for a commit parts request
message CommitPartsResponse {}
