openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: |
    API for managing orders to build spaceships.

    Allows creating orders, retrieving information about them,
    paying for and cancelling orders.

# servers - optional section, specifies base URLs for the API.
# Used:
# - when generating a client (default baseURL)
# - in Swagger UI / Redoc (environment selection)
# - to document available environments (dev, staging, prod)
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Orders
    description: Order operations — create, retrieve, pay and cancel

paths:
  /api/v1/orders:
    $ref: ./paths/orders.yaml
  /api/v1/orders/{order_uuid}:
    $ref: ./paths/order_by_uuid.yaml
  /api/v1/orders/{order_uuid}/pay:
    $ref: ./paths/order_pay.yaml
  /api/v1/orders/{order_uuid}/cancel:
    $ref: ./paths/order_cancel.yaml
