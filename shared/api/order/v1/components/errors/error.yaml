# Single error schema shared by all HTTP codes.
#
# The Go type name is generated by ogen from the file name (error.yaml ->
# Error), so a separate `name:` field isn't needed here (and, in fact, it's
# invalid from an OpenAPI standpoint and gets flagged by linters).
#
# Benefits of a single schema:
# - Reduces duplication (all errors share the same structure)
# - Simplifies maintenance (changes in one place)
# - Generates a single base Error type in the Go code
#
# The concrete example for each HTTP code lives not here but in
# components/responses/*.yaml — this overrides the schema's example at the
# media type level so Swagger UI shows the correct example for each code.
type: object
required:
  - code
  - message
properties:
  code:
    type: integer
    description: HTTP error code
  message:
    type: string
    description: Human-readable error description
